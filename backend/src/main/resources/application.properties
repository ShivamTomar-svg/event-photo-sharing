
spring.application.name=event-photo-sharing

server.port=${PORT:8085}

spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/event_photo_sharing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:eventshare_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:ChangeThis_StrongPassword_2026!}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:EventShare_JWT_Secret_2026_Local_Development_Key_987654321}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.csrf=TRACE
logging.level.com.eventshare=DEBUG
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB