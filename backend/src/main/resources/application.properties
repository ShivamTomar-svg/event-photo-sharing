spring.application.name=event-photo-sharing

server.port=${PORT:8085}

# Dynamic DataSource Configuration:
# - Prioritizes SPRING_DATASOURCE_URL if explicitly set.
# - Otherwise constructs JDBC URL from Railway variables (MYSQLHOST, MYSQLPORT, MYSQLDATABASE).
# - Falls back to local development defaults when no environment variables are present.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:event_photo_sharing}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:eventshare_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:ChangeThis_StrongPassword_2026!}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:EventShare_JWT_Secret_2026_Local_Development_Key_987654321}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Logging configuration
logging.level.org.springframework.security=WARN
logging.level.com.eventshare=INFO

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB